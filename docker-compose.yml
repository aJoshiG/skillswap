# Run the whole stack:  docker compose up --build   then open http://localhost:8080
# Seed demo data:       docker compose exec server node scripts/seed.js
services:
  mongo:
    image: mongo:7
    # A single-node replica set, so MongoDB transactions work.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20

  server:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/skillswap?replicaSet=rs0
      CLIENT_URL: http://localhost:8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production}
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: 'false'
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '4000:4000'

  client:
    build: ./client
    depends_on:
      - server
    ports:
      - '8080:80'

volumes:
  mongo-data:
