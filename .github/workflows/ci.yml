name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server · lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Tests start an in-memory MongoDB replica set (mongodb-memory-server).
      - run: npm test

  client:
    name: Client · test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build

  e2e:
    name: End-to-end · Playwright + axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json
      - name: Install server (also provides the in-memory MongoDB)
        working-directory: server
        run: npm ci
      - name: Build client
        working-directory: client
        run: npm ci && npm run build
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      # Starts an in-memory MongoDB replica set, seeds it, serves the built app from the real
      # server in production mode, and runs every browser test plus the accessibility checks.
      - name: Run end-to-end tests
        working-directory: e2e
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
